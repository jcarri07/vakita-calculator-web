<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="15%" r="75%">
      <stop offset="0%" stop-color="#0f3c2b"/>
      <stop offset="45%" stop-color="#071a13"/>
      <stop offset="100%" stop-color="#020805"/>
    </radialGradient>

    <!-- Top Neon Glow -->
    <radialGradient id="topGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom Accent Glow -->
    <radialGradient id="bottomGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>

    <!-- Emerald Text Gradient -->
    <linearGradient id="emeraldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Gold Text Gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E281E" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#081A12" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Red Alert Badge Gradient -->
    <linearGradient id="redBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#991B1B" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowBig" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#10B981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .title-sub { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 28px; font-weight: 800; fill: #6EE7B7; letter-spacing: 4px; text-transform: uppercase; }
    .title-main { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 58px; font-weight: 900; fill: #FFFFFF; text-anchor: middle; line-height: 1.1; }
    .title-highlight { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 68px; font-weight: 900; fill: url(#emeraldText); text-anchor: middle; }
    .badge-sub { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 800; fill: #FCA5A5; letter-spacing: 3px; text-transform: uppercase; }
    .badge-main { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 35px; font-weight: 900; fill: #FFFFFF; letter-spacing: 0px; }
    .card-title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 28px; font-weight: 800; fill: #A7F3D0; text-transform: uppercase; letter-spacing: 1.5px; }
    .rate-label { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 32px; font-weight: 700; fill: #E2E8F0; }
    .rate-number { font-family: 'Plus Jakarta Sans', monospace, sans-serif; font-size: 36px; font-weight: 900; fill: #34D399; }
    .feature-text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 30px; font-weight: 700; fill: #D1FAE5; }
    .btn-text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 34px; font-weight: 900; fill: #04140D; text-anchor: middle; }
    .sub-footer { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: 600; fill: #7EDBB5; text-anchor: middle; }
  </style>

  <!-- Canvas Background -->
  <rect width="1080" height="1920" fill="url(#bgGrad)"/>

  <!-- Glows -->
  <circle cx="540" cy="250" r="500" fill="url(#topGlow)"/>
  <circle cx="900" cy="1700" r="450" fill="url(#bottomGlow)"/>

  <!-- Top Pill / Logo -->
  <g transform="translate(540, 140)">
    <rect x="-190" y="-36" width="380" height="72" rx="36" fill="#10B981" fill-opacity="0.15" stroke="#34D399" stroke-width="2"/>
    <text x="0" y="11" text-anchor="middle" class="title-sub">🐮 VAKITA CALC</text>
  </g>

  <!-- Main Headline -->
  <text x="540" y="290" text-anchor="middle" class="title-main">La única calculadora</text>
  <text x="540" y="365" text-anchor="middle" class="title-main">de tasas de Venezuela</text>
  <text x="540" y="465" text-anchor="middle" class="title-highlight">LIBRE DE PUBLICIDAD</text>

  <!-- Big Red/Emerald No Ads Badge -->
  <g transform="translate(100, 530)" filter="url(#shadowBig)">
    <rect width="880" height="140" rx="32" fill="url(#redBadgeGrad)" stroke="#EF4444" stroke-width="3" stroke-opacity="0.8"/>
    <!-- Icon -->
    <text x="50" y="90" font-size="64">🚫</text>
    <text x="145" y="60" class="badge-sub">100% LIMPIA Y RÁPIDA</text>
    <text x="145" y="106" class="badge-main">Sin Anuncios • Sin Banners • Cero Videos</text>
  </g>

  <!-- Central Rate Showcase Card -->
  <g transform="translate(100, 720)" filter="url(#shadowBig)">
    <!-- Card Frame -->
    <rect width="880" height="490" rx="40" fill="url(#cardGrad)" stroke="#1F543C" stroke-width="2.5"/>

    <!-- Header inside Card -->
    <text x="50" y="70" class="card-title">Tasas en Tiempo Real</text>
    <circle cx="780" cy="60" r="10" fill="#10B981" filter="url(#glowGreen)"/>
    <text x="805" y="68" font-family="Plus Jakarta Sans, sans-serif" font-size="22" font-weight="800" fill="#34D399">EN VIVO</text>
    <line x1="50" y1="95" x2="830" y2="95" stroke="#163E2D" stroke-width="2"/>

    <!-- Row 1: USD BCV -->
    <rect x="50" y="125" width="780" height="90" rx="20" fill="#091E15" stroke="#1A4A35" stroke-width="1.5"/>
    <text x="80" y="180" font-size="40">🇺🇸</text>
    <text x="140" y="181" class="rate-label">Dólar BCV Oficial</text>
    <text x="800" y="181" text-anchor="end" class="rate-number">Tasa Oficial</text>

    <!-- Row 2: USDT Binance -->
    <rect x="50" y="235" width="780" height="90" rx="20" fill="#091E15" stroke="#1A4A35" stroke-width="1.5"/>
    <text x="80" y="290" font-size="40">🟢</text>
    <text x="140" y="291" class="rate-label">USDT / Binance P2P</text>
    <text x="800" y="291" text-anchor="end" class="rate-number">Mercado P2P</text>

    <!-- Row 3: Promedio -->
    <rect x="50" y="345" width="780" height="90" rx="20" fill="#091E15" stroke="#1A4A35" stroke-width="1.5"/>
    <text x="80" y="400" font-size="40">⚖️</text>
    <text x="140" y="401" class="rate-label">Promedio BCV + USDT</text>
    <text x="800" y="401" text-anchor="end" class="rate-number">Equilibrado</text>
  </g>

  <!-- Features Bullet Points -->
  <g transform="translate(110, 1260)">
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <circle cx="30" cy="20" r="22" fill="#10B981" fill-opacity="0.2"/>
      <text x="18" y="30" font-size="28" fill="#10B981">✓</text>
      <text x="75" y="30" class="feature-text">Cero interrupciones, banners molestos ni popups</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 80)">
      <circle cx="30" cy="20" r="22" fill="#10B981" fill-opacity="0.2"/>
      <text x="18" y="30" font-size="28" fill="#10B981">✓</text>
      <text x="75" y="30" class="feature-text">Calculadora de comisiones y margen comercial</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 160)">
      <circle cx="30" cy="20" r="22" fill="#10B981" fill-opacity="0.2"/>
      <text x="18" y="30" font-size="28" fill="#10B981">✓</text>
      <text x="75" y="30" class="feature-text">Historial completo con variación de las tasas</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(0, 240)">
      <circle cx="30" cy="20" r="22" fill="#10B981" fill-opacity="0.2"/>
      <text x="18" y="30" font-size="28" fill="#10B981">✓</text>
      <text x="75" y="30" class="feature-text">Instálala en iPhone (iOS) y Android como App</text>
    </g>
  </g>

  <!-- Bottom CTA Button -->
  <g transform="translate(100, 1630)" filter="url(#shadowBig)">
    <rect width="880" height="110" rx="30" fill="url(#btnGrad)"/>
    <text x="440" y="70" class="btn-text">⚡ Úsala gratis en cualquier navegador</text>
  </g>

  <text x="540" y="1800" class="sub-footer">iPhone • Android • PC • Mac • Sin descargar nada pesado</text>
</svg>
